name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # DOWNLINK_BUILD_TOOLS is ON here where the release build turns it OFF:
        # dltest is the only place the physics is written down as a number,
        # so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DDOWNLINK_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/dltest --list

      - name: Shaders
        # A GitHub macOS runner cannot create an accelerated GL context, so
        # this is where CI looks at the GLSL: every shipped shader through
        # glslc, by the same script verify.sh runs.
        run: |
          brew install shaderc
          tools/check-shaders.sh build/dltest

      - name: Offline
        # --offline is every check that needs no GL -- the names, the clock,
        # F.405, Rice's integrator and its convergence -- defined in dltest's
        # main(), not listed here, so a new check cannot be silently left out.
        # It says loudly what it did not run. Everything about the link itself
        # is GPU code and is in the next step.
        timeout-minutes: 10
        run: ./build/dltest --offline

      - name: Rendered
        # Only what Apple's software renderer can finish. The link is run per
        # sample on the GPU, and a GitHub macOS runner has no accelerated
        # context: on the software renderer --emphasis takes ~25 s and
        # --dispersal ~4 min at 320x180, while --clicks, --polarity,
        # --threshold, --identity, --seed, --resize and --negative each take
        # more than four minutes (measured with DLTEST_RENDERER=software), and
        # the full set ran past a 40-minute timeout on every push. Those, and
        # the control sweep, run on the dev Mac's GPU in tools/verify.sh, at
        # 320x180 and 1280x720, and the Windows build is swept in Arena by the
        # plugin-bench gate. This step checks the shaders compile and run on a
        # second rasteriser, not the physics.
        timeout-minutes: 15
        run: ./build/dltest --emphasis --dispersal --size 320x180 --allow-no-gl

      - name: Not run here
        run: |
          echo "NOT RUN IN CI: --clicks --polarity --threshold --identity --seed --resize --negative"
          echo "and tools/sweep.py. The software renderer is too slow for them; they run in"
          echo "tools/verify.sh on the dev Mac. See the Rendered step's comment."

      - uses: actions/upload-artifact@v4
        with:
          name: downlink-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DDOWNLINK_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: downlink-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
